# runner-config.yaml — 组织级 Runner / Autoscaler 配置（GitOps）
# =============================================================================
# 放置位置：本 org 的 config 仓库默认分支根目录，即 `{org}/config/config`
#           （project/repo slug 均可用 WULING_RUNNER_CONFIG_PROJECT /
#            WULING_RUNNER_CONFIG_REPO 改名）。
#
# 设计要点：
#   * 组织级、不能全局——每个 org 各自一份，互不影响。
#   * 走 git → 可经 Merge Request 评审、可审计、可回滚。
#   * 云凭证不写明文！用 `credentials_secret` 引用 org Secret 的名字，真正的
#     AK/SK / API token 存在加密 Secret 里（见 docs/pipelines.md §4）。
#
# 本文件是带注释的“示例”。复制到你 org 的 config 仓库后按需删改。
# v2 迁移：v1 仍可解析；将 aliyun.data_disk_size/data_disk_category 迁移为
# provider 的 data_disks 列表，并在 pool 顶层指定 runner_data_disk。v2 的
# aliyun/aws 池必须显式声明 vpc_id；实际 API 仍分别使用 vswitch_id/subnet_id。
# runner_data_disk 的容量必须在该 pool 的 data_disks 中唯一，确保 Linux/Windows
# 首启只能安全识别并格式化目标 RAW 非系统盘。
# 每个 isolated VM 会附带 wuling-isolated-job 审计标签，便于在云控制台盘点并清理临时实例。
# =============================================================================

version: 2

# job 未声明 `resource:` 且 runs-on 不含 `tier:*` 标签时的默认档位。
default_tier: medium

# 临时（autoscaled）runner 在「最近一次任务结束后」空闲超过此时长才释放。
# 故意保留宽限：按量计费 ECS/EC2 频繁起停既贵又慢（开机→注入 runner→注销很耗时）。
# 支持 Go duration 写法：30s / 5m / 1h。
idle_timeout: 5m

# 抽象档位 → 具体机器规格。Autoscaler 据此向各 provider 申请相应 CPU/内存/存储。
# storage 是根盘容量；cpu 为 vCPU；memory 支持 Mi/Gi。
tiers:
  low:
    cpu: 2
    memory: 4Gi
    storage: 40Gi
  medium:
    cpu: 4
    memory: 8Gi
    storage: 80Gi
  high:
    cpu: 8
    memory: 16Gi
    storage: 160Gi

# 自动扩缩容池。每个池 = 一个 provider + 一个 tier，向被它拉起的 runner 注入 `labels`。
# min: 始终维持的热备数（0 = 全按需）；max: 该池实例上限。
pools:
  # --- 阿里云 ECS（按量付费实例） -------------------------------------------
  - name: aliyun-medium
    provider: aliyun
    tier: medium
    labels: [linux, docker]
    min: 0
    max: 5
    # Runner 的 work/tools/state 将格式化并挂载在这块非系统盘；首次启动会
    # 销毁该 RAW 磁盘上的已有数据。为避免歧义，它的容量必须在 data_disks 中唯一；
    # 其他不同容量的 RAW 非根盘可以存在，但不会被 Runner 初始化。
    runner_data_disk: runner-work
    aliyun:
      region: cn-hangzhou
      zone_id: cn-hangzhou-i
      image_id: m-xxxxxxxx              # 预装容器运行时 + 武陵 runner 客户端的镜像（构建见 docs/pipelines.md §7.1）
      instance_type: ecs.g7.large       # 应与 tier 规格相称；也可用 instance_types 按序回退规避售罄
      vpc_id: vpc-xxxxxxxx              # v2 必填：用于自检/拓扑归属校验
      vswitch_id: vsw-xxxxxxxx
      security_group_id: sg-xxxxxxxx
      system_disk_category: cloud_essd  # 不填 system_disk_size 则取 tiers.<tier>.storage
      data_disks:
        - name: runner-work              # ECS 磁盘名称；runner_data_disk 必须命中该名称
          size: 120Gi
          category: cloud_essd
          performance_level: PL1
          delete_with_instance: true       # Runner 数据盘必须为 true，防止遗留计费卷/隔离数据
      internet_max_bandwidth_out: 5      # Mbps；0 = 不分配公网
      spot: true                         # 竞价实例进一步降本（可选）
      credentials_secret: ALIYUN_CREDS   # org Secret，JSON: {"access_key_id":"…","access_key_secret":"…"}

  # --- AWS EC2 ---------------------------------------------------------------
  - name: aws-high
    provider: aws
    tier: high
    labels: [linux, docker]
    min: 0
    max: 3
    runner_data_disk: runner-work
    aws:
      region: us-west-2
      ami: ami-xxxxxxxx                  # 预装容器运行时 + 武陵 runner 客户端的镜像（构建见 docs/pipelines.md §7.1）
      instance_type: c6i.2xlarge
      vpc_id: vpc-xxxxxxxx               # v2 必填：用于自检/拓扑归属校验
      subnet_id: subnet-xxxxxxxx
      security_group_ids: [sg-xxxxxxxx]
      data_disks:
        - name: runner-work
          size: 160Gi
          category: gp3
          device_name: /dev/sdf          # AWS 请求映射；Nitro 来宾内可能显示为 NVMe 名
          encrypted: true
          delete_with_instance: true
      iam_instance_profile: ""           # 可选
      spot: false
      credentials_secret: AWS_CREDS       # JSON: {"access_key_id":"…","secret_access_key":"…","session_token":"…"(可选)}

  # --- AWS EC2（Windows Server 2022；宿主 pwsh + 可选 Windows 容器） ----------
  - name: aws-windows
    provider: aws
    tier: medium
    os: windows                          # linux（默认）| windows；macOS 不能 autoscale，见文末
    labels: [windows]                    # 工作流用 runs-on: [windows] 命中（runner 也会自动带 windows 裸标签）
    min: 0
    max: 3
    runner_data_disk: runner-work
    aws:
      region: us-west-2
      ami: ami-xxxxxxxx                  # Windows Server 2022 镜像，预装 wuling-runner.exe + 计划任务（见 docs/pipelines.md §7.1、runners/images/windows）
      instance_type: c6i.2xlarge
      vpc_id: vpc-xxxxxxxx
      subnet_id: subnet-xxxxxxxx
      security_group_ids: [sg-xxxxxxxx]
      data_disks:
        - name: runner-work
          size: 160Gi
          category: gp3
          encrypted: true
          delete_with_instance: true
      spot: false
      credentials_secret: AWS_CREDS

  # --- 阿里云 ECS（Windows Server 2022；宿主 pwsh + 可选 Windows 容器） --------
  # 阿里云 Windows 自定义数据首行必须是 [powershell]（Vminit 插件），AWS 是
  # <powershell>（EC2Launch v2）；base64 前 ≤32 KB；只能半角 ASCII 字符；
  # labels 与 pool name 必须是 ASCII；不能写 C:\Users。
  # 镜像必须是 Sysprep 泛化过的自定义镜像，否则 Vminit 认为不是首次启动、不执行 user-data。
  - name: aliyun-windows
    provider: aliyun
    tier: medium
    os: windows
    labels: [windows]                      # labels 必须是半角 ASCII
    min: 0
    max: 3
    runner_data_disk: runner-work
    aliyun:
      region: cn-hangzhou
      zone_id: cn-hangzhou-i
      image_id: m-xxxxxxxx                 # Windows Server 2022 自定义镜像（runners/images/windows/setup.ps1）
      instance_types: [ecs.g8i.xlarge, ecs.g7.xlarge]   # 按序回退，规避某一规格售罄
      vpc_id: vpc-xxxxxxxx
      vswitch_id: vsw-xxxxxxxx
      security_group_id: sg-xxxxxxxx
      system_disk_size: 120Gi              # 不填则取 tiers.<tier>.storage
      system_disk_category: cloud_essd
      data_disks:
        - name: runner-work
          size: 160Gi
          category: cloud_essd
          performance_level: PL1
          delete_with_instance: true
      instance_charge_type: PostPaid
      auto_release_hours: 24               # 兜底自毁，防控制面异常时实例泄漏
      # ⚠️ Windows 必填：阿里云在 Windows 实例上**忽略** key_pair_name，只认 Password。
      password_secret: ALIYUN_WIN_PASSWORD  # org Secret，存明文登录密码
      credentials_secret: ALIYUN_CREDS

  # --- 本地 Proxmox VE（REST API，克隆模板） ---------------------------------
  - name: proxmox-low
    provider: proxmox
    tier: low
    labels: [linux, docker]
    min: 1                               # 留一台常驻热备
    max: 4
    proxmox:
      api_url: https://pve.example.com:8006/api2/json
      node: pve
      template_vmid: 9000                # 预装 runner 的模板，克隆出新机
      storage: local-lvm
      bridge: vmbr0
      full_clone: true
      insecure_tls: false
      credentials_secret: PROXMOX_CREDS   # JSON: {"token_id":"user@pam!ci","token_secret":"…"}

  # --- 本地 VMware vCenter（govmomi，克隆模板） ------------------------------
  - name: vcenter-medium
    provider: vcenter
    tier: medium
    labels: [linux, docker]
    min: 0
    max: 3
    vcenter:
      url: https://vcenter.example.com/sdk
      datacenter: DC1
      cluster: Cluster1
      datastore: ds-ssd-01
      resource_pool: ""                  # 空 = 集群默认
      folder: /DC1/vm/runners
      template: ubuntu-2204-runner       # 预装 runner 的虚机模板
      network: "VM Network"
      insecure_tls: false
      credentials_secret: VCENTER_CREDS   # JSON: {"username":"ci@vsphere.local","password":"…"}

# --- macOS（不在此配置） ----------------------------------------------------
# macOS runner 不能 autoscale（Apple 授权要求跑在 Apple 硬件上），因此**不在 pools 里配置**——
# 把 macos 写进某个池会被 config 校验直接拒绝。手动注册物理 Mac：用 runners/images/macos/setup.sh
# 装好 runner + launchd 模板，填入 server URL 和 UI 生成的注册令牌即可。工作流用 runs-on: [macos]
# 命中。详见 docs/pipelines.md §7.1。
