name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # to create the GitHub Release & upload artifacts
  packages: write # to push images to ghcr.io
  id-token: write # for cosign / OIDC if/when we add signing

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Cross-compile the two Go binaries for the platforms we publish.
  # ─────────────────────────────────────────────────────────────────────────
  build-binaries:
    name: Build ${{ matrix.os }}/${{ matrix.arch }} binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # libgit2 is a cgo dep. On Linux runners we need apt; on macOS we use brew.
      # Each linux arch builds on its own native runner (ubuntu-latest for amd64,
      # ubuntu-24.04-arm for arm64), so no cross-compile toolchain is needed.
      - name: Install libgit2 (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev pkg-config build-essential

      - name: Install libgit2 (macOS)
        if: matrix.os == 'darwin'
        run: brew install libgit2 pkg-config

      - name: Build binaries
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
        run: |
          mkdir -p out
          VERSION="${GITHUB_REF_NAME}"
          # -trimpath strips local paths; -s -w strips symbol & debug info
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o "out/wuling-api-${{ matrix.os }}-${{ matrix.arch }}"     ./cmd/wuling-api
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o "out/wuling-migrate-${{ matrix.os }}-${{ matrix.arch }}" ./cmd/wuling-migrate

      - name: Compress + checksum
        run: |
          cd out
          for f in wuling-api-* wuling-migrate-*; do
            tar -czf "${f}.tar.gz" "${f}"
            sha256sum "${f}.tar.gz" > "${f}.tar.gz.sha256" || shasum -a 256 "${f}.tar.gz" > "${f}.tar.gz.sha256"
            rm "${f}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # 1b. Cross-compile the Rust runner client for each runner platform.
  #     Linux is static musl, so custom runner images need NO Rust toolchain
  #     and no libc/openssl at runtime (smallest footprint). Each target builds
  #     on its native runner to avoid cross-link toolchains.
  # ─────────────────────────────────────────────────────────────────────────
  build-runner:
    name: Build runner ${{ matrix.os }}/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: linux,
              arch: amd64,
              target: x86_64-unknown-linux-musl,
              runner: ubuntu-latest,
            }
          - {
              os: linux,
              arch: arm64,
              target: aarch64-unknown-linux-musl,
              runner: ubuntu-24.04-arm,
            }
          - {
              os: windows,
              arch: amd64,
              target: x86_64-pc-windows-msvc,
              runner: windows-latest,
            }
          - {
              os: darwin,
              arch: amd64,
              target: x86_64-apple-darwin,
              runner: macos-15-intel,
            }
          - {
              os: darwin,
              arch: arm64,
              target: aarch64-apple-darwin,
              runner: macos-14,
            }
    runs-on: ${{ matrix.runner }}
    environment: production
    defaults:
      run:
        working-directory: runners/runner-clients
    steps:
      - uses: actions/checkout@v4
        with:
          # This job only builds and uploads artifacts; it never pushes to git,
          # so don't leave the contents:write token in the local git config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl-tools provides musl-gcc, which ring's build script needs for the
      # *-unknown-linux-musl targets.
      - name: Install musl tools (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runners/runner-clients

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p out
          f="wuling-runner-${{ matrix.os }}-${{ matrix.arch }}"
          tar -czf "out/${f}.tar.gz" -C "target/${{ matrix.target }}/release" wuling-runner
          ( cd out && { sha256sum "${f}.tar.gz" > "${f}.tar.gz.sha256" || shasum -a 256 "${f}.tar.gz" > "${f}.tar.gz.sha256"; } )

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $f = "wuling-runner-${{ matrix.os }}-${{ matrix.arch }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/wuling-runner.exe" -DestinationPath "out/$f.zip" -Force
          "$((Get-FileHash "out/$f.zip" -Algorithm SHA256).Hash.ToLower())  $f.zip" | Out-File -Encoding ascii "out/$f.zip.sha256"

      - name: Build Inno Setup installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Image may already have Inno Setup; install only when ISCC is missing.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after installing Inno Setup" }
          $exe = (Resolve-Path "target/${{ matrix.target }}/release/wuling-runner.exe").Path
          $outDir = (Resolve-Path "out").Path
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $iss = (Resolve-Path "../packaging/windows/wuling-runner.iss").Path
          & $iscc /Q `
            "/DMyAppVersion=$ver" `
            "/DRunnerExe=$exe" `
            "/DOutDir=$outDir" `
            $iss
          $setup = Join-Path $outDir "wuling-runner-windows-amd64-setup.exe"
          if (-not (Test-Path $setup)) { throw "installer not produced: $setup" }
          "$((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower())  wuling-runner-windows-amd64-setup.exe" |
            Out-File -Encoding ascii (Join-Path $outDir "wuling-runner-windows-amd64-setup.exe.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: runner-${{ matrix.os }}-${{ matrix.arch }}
          path: runners/runner-clients/out/*
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Frontend bundle.
  # ─────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build frontend bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + build
        working-directory: frontend
        run: |
          npm ci
          npm run api:types
          npm run build

      # Tag releases never run frontend-check.yml, so prerender here too —
      # otherwise the shipped tar lacks dist/help/** that Caddy/nginx fall back to.
      - name: Prerender help pages into dist
        working-directory: frontend
        run: npm run help:smoke

      # The PR gate in frontend-check.yml never runs on a tag, so without this
      # the artifact that actually ships is the one bundle nothing checks.
      - name: Verify brand assets survived the build
        run: ./scripts/verify-brand-assets.sh

      - name: Tar + checksum
        run: |
          tar -czf "wuling-frontend-dist-${GITHUB_REF_NAME}.tar.gz" -C frontend/dist .
          sha256sum "wuling-frontend-dist-${GITHUB_REF_NAME}.tar.gz" > "wuling-frontend-dist-${GITHUB_REF_NAME}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            wuling-frontend-dist-*.tar.gz
            wuling-frontend-dist-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Docker images for ghcr.io.
  # ─────────────────────────────────────────────────────────────────────────
  build-images:
    name: Build & push Docker images (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              arch: amd64,
              platform: linux/amd64,
              runner: ubuntu-latest,
            }
          - {
              arch: arm64,
              platform: linux/arm64,
              runner: ubuntu-24.04-arm,
            }
    runs-on: ${{ matrix.runner }}
    environment: production
    needs: [build-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ github.repository_owner }}/wuling-api
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Build & push frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/production/Dockerfile.frontend
          target: static
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ github.repository_owner }}/wuling-frontend
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Build & push help (SSR) image
        id: help
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/production/Dockerfile.frontend
          target: help
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ github.repository_owner }}/wuling-help
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Save image digests
        run: |
          mkdir -p "$RUNNER_TEMP/docker-digests"
          printf '%s\n' '${{ steps.api.outputs.digest }}' > "$RUNNER_TEMP/docker-digests/wuling-api-${{ matrix.arch }}.digest"
          printf '%s\n' '${{ steps.frontend.outputs.digest }}' > "$RUNNER_TEMP/docker-digests/wuling-frontend-${{ matrix.arch }}.digest"
          printf '%s\n' '${{ steps.help.outputs.digest }}' > "$RUNNER_TEMP/docker-digests/wuling-help-${{ matrix.arch }}.digest"

      - name: Upload image digests
        uses: actions/upload-artifact@v4
        with:
          name: docker-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/docker-digests/*.digest
          if-no-files-found: error
          retention-days: 1

  merge-image-manifests:
    name: Publish multi-architecture image manifests
    runs-on: ubuntu-latest
    environment: production
    needs: [build-images]
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: docker-digests-*
          path: ${{ runner.temp }}/docker-digests
          merge-multiple: true

      - name: Create and verify multi-architecture manifests
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"

          for image in wuling-api wuling-frontend wuling-help; do
            amd64_digest="$(< "$RUNNER_TEMP/docker-digests/${image}-amd64.digest")"
            arm64_digest="$(< "$RUNNER_TEMP/docker-digests/${image}-arm64.digest")"

            docker buildx imagetools create \
              --tag "${REGISTRY}/${image}:${VERSION}" \
              --tag "${REGISTRY}/${image}:latest" \
              --tag "${REGISTRY}/${image}:sha-${short_sha}" \
              "${REGISTRY}/${image}@${amd64_digest}" \
              "${REGISTRY}/${image}@${arm64_digest}"

            docker buildx imagetools inspect "${REGISTRY}/${image}:${VERSION}"
          done

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Nix flake check (cheap smoke test that the flake still builds).
  # ─────────────────────────────────────────────────────────────────────────
  nix-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix --extra-experimental-features 'nix-command flakes' flake check --no-build

  # ─────────────────────────────────────────────────────────────────────────
  # 5. Publish the GitHub Release with all the artifacts attached.
  # ─────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      [build-binaries, build-runner, build-frontend, merge-image-manifests, nix-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true
          # Skip the auto-generated *.dockerbuild build-record artifacts that
          # docker/build-push-action uploads; we only want the release bundles.
          pattern: "@(binaries-*|runner-*|frontend-dist)"

      - name: Verify checksums
        run: |
          cd release
          ls -la
          # Each artifact ships its own .sha256 — verify them all.
          for f in *.sha256; do
            ( cd "$(dirname "$f")" && sha256sum -c "$(basename "$f")" )
          done

      - name: Build release notes
        id: notes
        run: |
          cat > NOTES.md <<EOF
          ## Wuling DevOps ${GITHUB_REF_NAME}

          ### Container images

          - \`ghcr.io/${{ github.repository_owner }}/wuling-api:${GITHUB_REF_NAME}\`
          - \`ghcr.io/${{ github.repository_owner }}/wuling-frontend:${GITHUB_REF_NAME}\`
          - \`ghcr.io/${{ github.repository_owner }}/wuling-help:${GITHUB_REF_NAME}\`

          ### Binaries

          Each platform is shipped as a \`.tar.gz\` with an adjacent
          \`.sha256\` checksum file. Verify with:

          \`\`\`
          sha256sum -c wuling-api-linux-amd64.tar.gz.sha256
          \`\`\`

          ### Runner clients

          \`wuling-runner-<os>-<arch>\` for Linux (static musl), Windows (\`.zip\`
          + Inno Setup \`wuling-runner-windows-amd64-setup.exe\`), and macOS.
          Build a custom runner image by dropping the prebuilt binary in with
          \`runners/images/<os>/setup.*\` — no Rust toolchain required.

          ### Frontend

          - \`wuling-frontend-dist-${GITHUB_REF_NAME}.tar.gz\` — Nasti build
            output, ready to drop into a CDN or static-file server.

          ### Nix

          \`\`\`
          nix build github:zixiao-labs/Wuling-DevOps/${GITHUB_REF_NAME}#wuling-api
          \`\`\`

          See \`deploy/production/README.md\` for full upgrade instructions.
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.SYNC_PAT }}
          body_path: NOTES.md
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.exe
            release/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
