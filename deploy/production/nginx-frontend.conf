# nginx config for the static frontend container.
#
# - Listens on 8080 (so nginx can run as non-root)
# - SPA fallback: unknown paths get index.html
# - Hash-named assets cached for a year (Nasti emits content hashes in /assets)
# - index.html / sw.js never cached
# - gzip enabled (Nasti also writes .gz pre-compressed; we serve those when
#   present via gzip_static)

server {
    listen 8080;
    server_name _;
    root /app/dist;
    index index.html;

    # Pre-compressed assets — much cheaper than per-request gzipping
    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Prerendered help pages (fallback copy; the SSR container is primary).
    location /help/ {
        try_files $uri $uri/index.html /help/index.html;
    }
    location = /help {
        return 301 /help/;
    }

    # SPA fallback — document shell must revalidate; hash assets are
    # handled by the more-specific /assets/ location below.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Hash-named assets — fingerprinted so safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Brand assets live at the document root (copied out of frontend/public by
    # the copy-public plugin in nasti.config.ts). They are NOT content-hashed,
    # so they get a short revalidating cache rather than the immutable year.
    location ~ ^/(favicon\.ico|favicon-32\.png|apple-touch-icon\.png|icon-\d+\.png|icon-maskable-\d+\.png|brand-wordmark\.png|og-image\.png)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Service worker + manifest must not be cached, or PWA updates stall.
    # Nasti emits the manifest as manifest.json (not .webmanifest).
    location = /sw.js               { add_header Cache-Control "no-cache"; }
    location = /manifest.json       { add_header Cache-Control "no-cache"; }
    location = /index.html          { add_header Cache-Control "no-cache"; }

    # Health probe target
    location = /_healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
